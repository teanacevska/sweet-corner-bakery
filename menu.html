<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exclusive Menu | Sweet Corner</title>
  <link rel="stylesheet" href="web%20storm.css">
  <style>
    :root {
      --bg-cream: #fbf7f4;
      --card-bg: #ffffff;
      --primary-burgundy: #8b3a4c;
      --burgundy-dark: #6d2c3c;
      --text-main: #3b272d;
      --text-muted: #7a5e66;
      --border-subtle: #ebd5ce;
    }

    body {
      background-color: var(--bg-cream);
      background-image: radial-gradient(var(--primary-burgundy) 1.2px, transparent 1.2px);
      background-size: 26px 26px;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
    }

    header {
      background: #ffffff;
      border-bottom: 2px solid var(--primary-burgundy);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(139, 58, 76, 0.08);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
      padding: 15px 30px;
    }

    .logo img {
      height: 45px;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
      margin: 0;
      padding: 0;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-main);
      font-weight: 500;
      font-size: 14px;
      transition: color 0.3s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--primary-burgundy);
      font-weight: 600;
    }

    .dropdown {
      position: relative;
      padding-bottom: 10px;
      margin-bottom: -10px;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      min-width: 150px;
      box-shadow: 0 12px 30px rgba(139, 58, 76, 0.18);
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      z-index: 100;
      text-align: center;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .dropdown-content a {
      color: var(--text-main);
      padding: 12px 18px;
      display: block;
      font-size: 13px;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }

    .dropdown-content a:hover {
      background: #f7edec;
      color: var(--primary-burgundy);
    }

    .cart-btn-standard {
      background: var(--primary-burgundy);
      color: white;
      border: none;
      padding: 11px 22px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      box-shadow: 0 5px 15px rgba(139, 58, 76, 0.25);
      transition: all 0.3s;
    }

    .cart-btn-standard:hover {
      background: var(--burgundy-dark);
    }

    .menu-hero {
      text-align: center;
      padding: 40px 20px 20px 20px;
      background: linear-gradient(180deg, rgba(139, 58, 76, 0.05) 0%, transparent 100%);
    }

    .category-pills {
      display: inline-flex;
      background: #ffffff;
      border: 2px solid var(--primary-burgundy);
      padding: 6px;
      border-radius: 50px;
      gap: 6px;
      box-shadow: 0 8px 25px rgba(139, 58, 76, 0.15);
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill-btn {
      background: transparent;
      border: none;
      padding: 10px 24px;
      font-family: 'Poppins', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .pill-btn:hover {
      color: var(--primary-burgundy);
    }

    .pill-btn.active {
      background: var(--primary-burgundy);
      color: white;
      box-shadow: 0 4px 15px rgba(139, 58, 76, 0.3);
    }

    .sub-pills-container {
      display: none;
      justify-content: center;
      gap: 8px;
      margin: 18px auto 0 auto;
      max-width: 1100px;
      flex-wrap: wrap;
    }

    .sub-pill {
      background: #ffffff;
      border: 1px solid var(--primary-burgundy);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--primary-burgundy);
      cursor: pointer;
      transition: all 0.3s;
    }

    .sub-pill:hover, .sub-pill.active {
      background: var(--primary-burgundy);
      color: white;
      font-weight: 600;
    }

    .catalog-section {
      padding: 30px 5% 100px 5%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .bento-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
    }

    @media (max-width: 1200px) {
      .bento-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 900px) {
      .bento-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .bento-grid { grid-template-columns: 1fr; }
    }

    .bento-card {
      background: var(--card-bg);
      border-radius: 26px;
      padding: 20px;
      border: 2px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(139, 58, 76, 0.08);
      transition: all 0.4s ease;
      cursor: pointer;
    }

    .bento-card:hover {
      transform: translateY(-6px);
      border-color: var(--primary-burgundy);
      box-shadow: 0 16px 40px rgba(139, 58, 76, 0.18);
    }

    .card-media {
      position: relative;
      width: 100%;
      height: 310px;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 16px;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.6s ease;
    }

    .bento-card:hover .card-media img {
      transform: scale(1.05);
    }

    .badge-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--primary-burgundy);
      color: white;
      font-size: 10px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 2;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 19px;
      color: var(--text-main);
      margin: 0 0 6px 0;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin: 0 0 18px 0;
      flex-grow: 1;
    }

    .action-pill-btn {
      background: #f7edec;
      color: var(--primary-burgundy);
      border: 1.5px solid var(--primary-burgundy);
      padding: 10px 20px;
      border-radius: 25px;
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: all 0.3s ease;
    }

    .action-pill-btn:hover {
      background: var(--primary-burgundy);
      color: white;
      box-shadow: 0 4px 15px rgba(139, 58, 76, 0.25);
    }

    .elite-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(59, 39, 45, 0.5);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 3000;
    }

    .elite-modal-content {
      background: #ffffff;
      border: 2px solid var(--primary-burgundy);
      padding: 30px;
      border-radius: 28px;
      max-width: 440px;
      width: 90%;
      position: relative;
      box-shadow: 0 20px 50px rgba(139, 58, 76, 0.25);
    }

    .modal-close {
      position: absolute;
      top: 18px; right: 22px;
      font-size: 24px;
      color: var(--primary-burgundy);
      cursor: pointer;
    }

    .elite-cart-drawer {
      position: fixed;
      top: 0; right: -420px;
      width: 380px; height: 100%;
      background: #ffffff;
      border-left: 2px solid var(--primary-burgundy);
      z-index: 3500;
      transition: right 0.4s ease;
      display: flex;
      flex-direction: column;
      box-shadow: -15px 0 40px rgba(139, 58, 76, 0.15);
    }

    .elite-cart-drawer.open { right: 0; }
  </style>
</head>

</div>

<section class="catalog-section">
  <div class="bento-grid" id="bento-grid"></div>
</section>


<div class="elite-modal-overlay" id="elite-modal" onclick="closeModalOutside(event)">
  <div class="elite-modal-content" onclick="event.stopPropagation()">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <div class="card-media" style="height: 300px; margin-bottom: 15px; background: #ffffff;">
      <img id="m-img" src="" alt="" style="width:100%; height:100%; object-fit:contain;">
    </div>
    <h3 id="m-title" style="font-family:'Playfair Display',serif; font-size:22px; color:var(--text-main); margin:0 0 8px 0;"></h3>
    <p id="m-desc" style="font-size:13px; color:var(--text-muted); margin:0 0 16px 0; line-height:1.5;"></p>

    <label style="font-size:11px; font-weight:600; color:var(--primary-burgundy); text-transform:uppercase; display:block; margin-bottom:6px; letter-spacing:1px;">Select Option:</label>
    <select id="m-select" style="width:100%; padding:12px; background:#fbf7f4; border:1px solid var(--primary-burgundy); color:var(--text-main); border-radius:12px; margin-bottom:16px; font-family:'Poppins',sans-serif; outline:none;" onchange="calculatePrice()"></select>

    <div style="display:flex; justify-content:space-between; align-items:center; background:#fbf7f4; padding:10px 16px; border-radius:12px; margin-bottom:18px; border:1px solid var(--primary-burgundy);">
      <span style="font-size:12px; color:var(--text-muted);">Quantity:</span>
      <div style="display:flex; align-items:center; gap:14px;">
        <button style="width:30px; height:30px; border-radius:50%; border:1px solid var(--primary-burgundy); background:transparent; color:var(--primary-burgundy); cursor:pointer; font-weight:bold;" onclick="changeQty(-1)">-</button>
        <span id="m-qty" style="font-weight:600; font-size:16px; color:var(--text-main);">1</span>
        <button style="width:30px; height:30px; border-radius:50%; border:1px solid var(--primary-burgundy); background:var(--primary-burgundy); color:white; cursor:pointer; font-weight:bold;" onclick="changeQty(1)">+</button>
      </div>
    </div>

    <div id="m-price" style="font-size:20px; font-weight:700; color:var(--primary-burgundy); margin-bottom:20px; text-align:center;">€0.00</div>
    <button class="action-pill-btn" style="background:var(--primary-burgundy); color:white; font-weight:600; padding:14px;" onclick="addToCartFinal()">Confirm and Add</button>
  </div>
</div>


<div class="elite-cart-drawer" id="elite-cart">
  <div style="padding:24px; background:#f7edec; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--primary-burgundy);">
    <h3 style="font-family:'Playfair Display',serif; margin:0; font-size:20px; color:var(--text-main);">Your Cart</h3>
    <span style="font-size:24px; cursor:pointer; color:var(--primary-burgundy);" onclick="toggleCart()">&times;</span>
  </div>
  <div id="cart-items-box" style="padding:20px; flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:14px;"></div>
  <div style="padding:24px; background:#f7edec; border-top:2px solid var(--primary-burgundy);">
    <div style="display:flex; justify-content:space-between; font-weight:700; font-size:18px; margin-bottom:18px; color:var(--text-main);">
      <span>Total:</span>
      <span id="cart-total-sum" style="color:var(--primary-burgundy);">€0.00</span>

    <button class="action-pill-btn" style="background:var(--primary-burgundy); color:white; font-weight:600; padding:15px;" onclick="checkoutAction()">Order Now ✨</button>
  </div>
</div>

  let activeCat = 'torti';
  let activeSub = 'site';
  let currentSelection = null;
  let cartData = JSON.parse(localStorage.getItem('eliteCartEn')) || [];

  window.onload = () => {
    buildCatalog('torti');
    refreshCartUI();
  };

  function switchCategory(category) {
    activeCat = category;
    document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
    event.currentTarget.classList.add('active');

    const subContainer = document.getElementById('sub-pills-container');
    if(category === 'napitoci') {
      subContainer.style.display = 'flex';
      switchSubCategory('site');
    } else {
      subContainer.style.display = 'none';
      buildCatalog(category);
    }
  }

  function switchSubCategory(sub) {
    activeSub = sub;
    document.querySelectorAll('.sub-pill').forEach(p => p.classList.remove('active'));
    event.currentTarget.classList.add('active');
    buildCatalog('napitoci', sub);
  }

  function buildCatalog(cat, sub = 'site') {
    const grid = document.getElementById('bento-grid');
    grid.innerHTML = '';

    const list = catalog.filter(item => {
      if(item.cat !== cat) return false;
      if(cat === 'napitoci' && sub !== 'site' && item.sub !== sub) return false;
      return true;
    });

    list.forEach(el => {
      const card = document.createElement('div');
      card.className = 'bento-card';
      card.innerHTML = `
        <div>
          <div class="card-media">
            <div class="badge-tag">${el.badge}</div>
            <img src="${el.img}" alt="${el.name}">
          </div>
          <h3 class="card-title">${el.name}</h3>
          <p class="card-desc">${el.desc}</p>
        </div>
        <div class="card-action-bar">
          <button class="action-pill-btn" onclick='openModal(${JSON.stringify(el)})'>Select Option</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function openModal(item) {
    currentSelection = item;
    document.getElementById('m-title').innerText = item.name;
    document.getElementById('m-desc').innerText = item.desc;
    document.getElementById('m-img').src = item.img;
    document.getElementById('m-qty').innerText = 1;

    const selectEl = document.getElementById('m-select');
    selectEl.innerHTML = '';
    for (const [optName, optPrice] of Object.entries(item.options)) {
      const opt = document.createElement('option');
      opt.value = optPrice;
      opt.innerText = `${optName} - €${optPrice.toFixed(2)}`;
      selectEl.appendChild(opt);
    }

    calculatePrice();
    document.getElementById('elite-modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('elite-modal').style.display = 'none';
  }

  function closeModalOutside(e) {
    if (e.target.id === 'elite-modal') {
      closeModal();
    }
  }

  function changeQty(amount) {
    let qtyEl = document.getElementById('m-qty');
    let val = parseInt(qtyEl.innerText) + amount;
    if (val < 1) val = 1;
    qtyEl.innerText = val;
    calculatePrice();
  }

  function calculatePrice() {
    const selectEl = document.getElementById('m-select');
    const unitPrice = parseFloat(selectEl.value) || 0;
    const qty = parseInt(document.getElementById('m-qty').innerText) || 1;
    const total = unitPrice * qty;
    document.getElementById('m-price').innerText = `€${total.toFixed(2)}`;
  }

  function addToCartFinal() {
    if (!currentSelection) return;
    const selectEl = document.getElementById('m-select');
    const optionText = selectEl.options[selectEl.selectedIndex].text.split(' - ')[0];
    const unitPrice = parseFloat(selectEl.value);
    const qty = intVal = parseInt(document.getElementById('m-qty').innerText);

    const cartItem = {
      name: currentSelection.name,
      option: optionText,
      price: unitPrice,
      qty: qty,
      img: currentSelection.img
    };

    cartData.push(cartItem);
    saveAndRefreshCart();
    closeModal();
    toggleCart();
  }

  function toggleCart() {
    const drawer = document.getElementById('elite-cart');
    drawer.classList.toggle('open');
  }

  function saveAndRefreshCart() {
    localStorage.setItem('eliteCartEn', JSON.stringify(cartData));
    refreshCartUI();
  }

  function refreshCartUI() {
    document.getElementById('cart-counter').innerText = cartData.reduce((sum, item) => sum + item.qty, 0);
    const box = document.getElementById('cart-items-box');
    box.innerHTML = '';

    let totalSum = 0;

    if (cartData.length === 0) {
      box.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:13px; margin-top:40px;">Your cart is empty.</p>';
    } else {
      cartData.forEach((item, index) => {
        let itemTotal = item.price * item.qty;
        totalSum += itemTotal;
        const div = document.createElement('div');
        div.style.cssText = 'display:flex; gap:12px; align-items:center; background:#ffffff; padding:10px; border-radius:12px; border:1px solid var(--border-subtle);';
        div.innerHTML = `
          <img src="${item.img}" style="width:50px; height:50px; object-fit:contain; border-radius:8px; background:#fbf7f4;">
          <div style="flex:1;">
            <h4 style="margin:0 0 2px 0; font-size:13px; font-family:'Playfair Display',serif; color:var(--text-main);">${item.name}</h4>
            <span style="font-size:11px; color:var(--text-muted);">${item.option} x ${item.qty}</span>
          </div>
          <div style="text-align:right;">
            <div style="font-size:13px; font-weight:700; color:var(--primary-burgundy);">€${itemTotal.toFixed(2)}</div>
            <span style="font-size:11px; color:#cc0000; cursor:pointer;" onclick="removeItem(${index})">Remove</span>
          </div>
        `;
        box.appendChild(div);
      });
    }

    document.getElementById('cart-total-sum').innerText = `€${totalSum.toFixed(2)}`;
  }

  function removeItem(index) {
    cartData.splice(index, 1);
    saveAndRefreshCart();
  }

  function checkoutAction() {
    if (cartData.length === 0) {
      alert('Your cart is empty!');
      return;
    }
    alert('Thank you for your order! We are preparing your sweet treats ✨');
    cartData = [];
    saveAndRefreshCart();
    toggleCart();
  }
</script>
